# robot_localization EKF 配置 — ICP scan-to-map 定位融合
frequency: 80

sensor_timeout: 1

two_d_mode: true

map_frame: map
odom_frame: odom
base_link_frame: base_link
world_frame: map

# ICP scan-to-map 定位结果 (PoseWithCovarianceStamped)
pose0: /location_match
pose0_config: [true, true, false, false, false, true,
               false, false, false, false, false, false,
               false, false, false]
pose0_queue_size: 100

# 轮式里程计 (Odometry, velocity only)
odom0: /odom
odom0_config: [false, false, false,
              false, false, false,
              true, true, false,
              false, false, true,
              false, false, false]
odom0_queue_size: 50
odom0_differential: true

# 使用控制命令辅助预测
use_control: true
stamped_control: false
control_config: [true, true, false, false, false, true]
acceleration_limits: [1.5, 1.5, 0.0, 0.0, 0.0, 9]
deceleration_limits: [1.5, 1.5, 0.0, 0.0, 0.0, 9]

# 滞后数据补偿（ICP 计算较慢时有用）
smooth_lagged_data: true
history_length: 2

# 过程噪声协方差
