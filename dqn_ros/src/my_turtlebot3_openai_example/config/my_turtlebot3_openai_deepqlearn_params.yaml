turtlebot3: #namespace

    task_and_robot_environment_name: 'TurtleBot3World-v0'
    # ros_ws_abspath: "/home/gz/simulation_ws"
    ros_ws_abspath: "/root/nav_project/dqn_ros_ws"
    running_step: 0.04 # amount of time the control will be executed
    pos_step: 0.016     # increment in position for each command

    #dqn parameters (优化版)
    gamma: 0.999        # discount rate
    epsilon_start: 0.9  # exploration rate 起始
    epsilon_end: 0.05   # exploration rate 终点
    epsilon_decay: 10000   # 更快从随机切换到学习
    n_episodes: 300      # 训练轮数
    target_update: 50   # 目标网络同步间隔
    batch_size: 64     # 更大批次，更稳定

    running_step: 0.06 # Time for each step default 0.06
    learning_rate: 0.001 # 提高 10 倍，加速学习

