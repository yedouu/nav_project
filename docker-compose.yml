# ============================================================
# nav_project 模块化 Docker Compose 部署
# 用法:
#   建图:      docker compose --profile gazebo --profile slam --profile teleop up -d
#   已知地图:  docker compose --profile gazebo --profile navigation up -d
#   一键全栈:  docker compose --profile all up -d
#   交互Shell: docker compose run --rm shell bash
# ============================================================


x-common: &common
  image: ${IMAGE_NAME:-nav_project}:${IMAGE_TAG:-latest}
  network_mode: host
  environment:
    DISPLAY: ${DISPLAY:-:0}
    QT_X11_NO_MITSHM: "1"
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: all
    TURTLEBOT3_MODEL: waffle_pi
    GAZEBO_MODEL_DATABASE_URI: ""
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - ${XDG_RUNTIME_DIR:-/run/user/1000}:/tmp/xdg-runtime:rw
    - ${HOME}/.Xauthority:/root/.Xauthority:rw
    - ./catkin_turtlebot3:/root/nav_project/catkin_turtlebot3:rw
    - ./catkin_cartographer:/root/nav_project/catkin_cartographer:rw
    - ./xtdrone_maps:/root/nav_project/xtdrone_maps:rw
    - ./xtdrone_worlds:/root/nav_project/xtdrone_worlds:ro
    - gazebo-cache:/root/.gazebo
  stdin_open: true
  tty: true
  runtime: nvidia

services:
  # ============================================================
  # 基础模块 (可独立启动)
  # ============================================================

  # Gazebo 仿真 + XTDrone 世界 + TurtleBot3 机器人
  gazebo:
    <<: *common
    container_name: nav-gazebo
    command: >
      bash -c "
      echo '[gazebo] 启动 Gazebo + XTDrone 世界...' ;
      roslaunch /root/nav_project/catkin_turtlebot3/src/turtlebot3/turtlebot3_slam/launch/xtdrone_world.launch
        world_name:=${WORLD_FILE:-/root/nav_project/xtdrone_worlds/indoor3.world}
      "
    profiles:
      - all
      - mapping
      - nav
      - gazebo

  # Cartographer SLAM 建图
  slam:
    <<: *common
    container_name: nav-slam
    command: >
      bash -c "
      sleep 8 ;
      echo '[slam] 启动 Cartographer SLAM...' ;
      roslaunch turtlebot3_slam turtlebot3_cartographer.launch
        configuration_basename:=turtlebot3_lds_2d_gazebo.lua
      "
    profiles:
      - all
      - mapping
      - slam

  # ICP 定位 + TEB 导航 + RViz (需要先验地图)
  navigation:
    <<: *common
    container_name: nav-navigation
    command: >
      bash -c "
      sleep 8 ;
      echo '[navigation] 启动 ICP 定位 + TEB 导航 + RViz...' ;
      roslaunch scan_to_map scan_to_map.launch
        map_file:=${MAP_FILE:-/root/nav_project/xtdrone_maps/indoor3.yaml}
      "
    profiles:
      - all
      - nav
      - navigation

  # 键盘遥控
  teleop:
    <<: *common
    container_name: nav-teleop
    command: >
      bash -c "
      echo '[teleop] 键盘遥控 (WASD 控制)...' ;
      roslaunch turtlebot3_teleop turtlebot3_teleop_key.launch
      "
    profiles:
      - all
      - mapping
      - teleop

  # RViz 可视化 (独立打开)
  rviz:
    <<: *common
    container_name: nav-rviz
    command: >
      bash -c "
      echo '[rviz] 启动 RViz...' ;
      rosrun rviz rviz -d /root/nav_project/catkin_turtlebot3/src/scan_to_map/rviz/scan_to_map.rviz
      "
    profiles:
      - viz
      - rviz

  # ============================================================
  # 交互式 Shell
  # ============================================================

  shell:
    <<: *common
    container_name: nav-shell
    profiles:
      - shell

volumes:
  gazebo-cache:
    driver: local
